<script type="text/babel">
const KEY = 'polaris-kit-route';
function App() {
  const [route, setRoute] = React.useState(() => localStorage.getItem(KEY) || 'landing');
  const go = r => { setRoute(r); localStorage.setItem(KEY, r); window.scrollTo(0, 0); };
  window.polarisLogout = () => go('landing');
  if (route === 'landing') return <Landing onLogin={() => go('inicio')} />;
  const screens = { inicio: <Dashboard go={go} />, odisea: <Odisea />, kuiper: <Kuiper />, fusion: <Fusion />, atlas: <Atlas />, perfil: <Perfil /> };
  return <AppShell route={route} go={go}>{screens[route] || screens.inicio}</AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
