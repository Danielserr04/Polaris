<!-- @dsCard group="Colors" viewport="700x130" name="Semantic" subtitle="Success, warning, danger, info with soft fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px;border-radius:4px;border:1px solid var(--border-1)}.s b{display:block;margin-top:8px;font:600 12px var(--font-sans);color:var(--text-1)}.s span{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--text-3)}.lab{font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="padding:12px;border-radius:4px;background:var(--success-bg);border:1px solid color-mix(in oklab,var(--success) 30%,transparent)"><div style="font:600 13px var(--font-sans);color:var(--success)">Guardado</div><div class="lab" style="margin-top:8px">--success</div></div><div style="padding:12px;border-radius:4px;background:var(--warning-bg);border:1px solid color-mix(in oklab,var(--warning) 30%,transparent)"><div style="font:600 13px var(--font-sans);color:var(--warning)">Sin verificar</div><div class="lab" style="margin-top:8px">--warning</div></div><div style="padding:12px;border-radius:4px;background:var(--danger-bg);border:1px solid color-mix(in oklab,var(--danger) 30%,transparent)"><div style="font:600 13px var(--font-sans);color:var(--danger)">Contraseña incorrecta</div><div class="lab" style="margin-top:8px">--danger</div></div><div style="padding:12px;border-radius:4px;background:var(--info-bg);border:1px solid color-mix(in oklab,var(--info) 30%,transparent)"><div style="font:600 13px var(--font-sans);color:var(--info)">Nuevo</div><div class="lab" style="margin-top:8px">--info</div></div></div></body></html>
