<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px;border-radius:4px;border:1px solid var(--border-1)}.s b{display:block;margin-top:8px;font:600 12px var(--font-sans);color:var(--text-1)}.s span{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--text-3)}.lab{font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}@keyframes mv{from{left:0}to{left:146px}}</style></head><body><div style="display:flex;gap:28px;align-items:flex-end"><div style="width:170px"><div style="height:40px;border-bottom:1px dashed var(--border-2);position:relative"><div style="position:absolute;bottom:6px;width:24px;height:24px;background:var(--accent);border-radius:3px;animation:mv 2.2s var(--ease-out) infinite alternate"></div></div><div class="lab" style="margin-top:10px">ease-out · 200ms</div></div><div style="width:170px"><div style="height:40px;border-bottom:1px dashed var(--border-2);position:relative"><div style="position:absolute;bottom:6px;width:24px;height:24px;background:var(--accent);border-radius:3px;animation:mv 2.2s var(--ease-spring) infinite alternate"></div></div><div class="lab" style="margin-top:10px">spring · 480ms</div></div><div style="width:170px"><div style="height:40px;border-bottom:1px dashed var(--border-2);position:relative"><div style="position:absolute;bottom:6px;width:24px;height:24px;background:var(--accent);border-radius:3px;animation:mv 2.2s var(--ease-in-out) infinite alternate"></div></div><div class="lab" style="margin-top:10px">in-out · 420ms</div></div></div></body></html>
