<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px;border-radius:4px;border:1px solid var(--border-1)}.s b{display:block;margin-top:8px;font:600 12px var(--font-sans);color:var(--text-1)}.s span{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--text-3)}.lab{font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div data-module="odisea" style="border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px"><span class="pl-icon" style="--pl-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/clapperboard.svg);width:22px;height:22px;color:var(--accent)"></span><div><div style="font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:18px">Odisea</div><div class="lab" style="margin-top:6px">Ocio</div></div></div><div data-module="kuiper" style="border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px"><span class="pl-icon" style="--pl-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/wallet.svg);width:22px;height:22px;color:var(--accent)"></span><div><div style="font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:18px">Kuiper</div><div class="lab" style="margin-top:6px">Gastos</div></div></div><div data-module="fusion" style="border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px"><span class="pl-icon" style="--pl-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/flame.svg);width:22px;height:22px;color:var(--accent)"></span><div><div style="font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:18px">Fusión</div><div class="lab" style="margin-top:6px">Nutrición</div></div></div><div data-module="atlas" style="border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px"><span class="pl-icon" style="--pl-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/dumbbell.svg);width:22px;height:22px;color:var(--accent)"></span><div><div style="font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:18px">Atlas</div><div class="lab" style="margin-top:6px">Gym</div></div></div><div data-module="nucleo" style="border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px"><span class="pl-icon" style="--pl-icon:url(https://unpkg.com/lucide-static@0.460.0/icons/orbit.svg);width:22px;height:22px;color:var(--accent)"></span><div><div style="font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:18px">Núcleo</div><div class="lab" style="margin-top:6px">Perfil y peso</div></div></div></div></body></html>
