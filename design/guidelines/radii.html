<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px;border-radius:4px;border:1px solid var(--border-1)}.s b{display:block;margin-top:8px;font:600 12px var(--font-sans);color:var(--text-1)}.s span{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--text-3)}.lab{font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:flex;gap:18px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:var(--radius-xs)"></div><span class="lab">xs · 2</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:var(--radius-sm)"></div><span class="lab">sm · 4</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:var(--radius-md)"></div><span class="lab">md · 6</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:10px"></div><span class="lab">nav · 10</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:var(--radius-round)"></div><span class="lab">round</span></div></div></body></html>
