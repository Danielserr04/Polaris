<!-- @dsCard group="Spacing" viewport="700x170" name="Block shadows" subtitle="Hard offset shadows appear on hover / focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px;border-radius:4px;border:1px solid var(--border-1)}.s b{display:block;margin-top:8px;font:600 12px var(--font-sans);color:var(--text-1)}.s span{display:block;font:400 10.5px/1.5 var(--font-mono);color:var(--text-3)}.lab{font:500 10px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}</style></head><body><div style="display:flex;gap:28px;padding:8px"><div style="display:flex;flex-direction:column;gap:12px"><div style="width:96px;height:64px;background:var(--surface-1);border:1px solid var(--border-1);border-radius:6px;box-shadow:none;"></div><span class="lab">rest</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:96px;height:64px;background:var(--surface-1);border:1px solid var(--accent);border-radius:6px;box-shadow:5px 5px 0 0 var(--accent-deep);transform:translate(-2px,-2px)"></div><span class="lab">hover · card</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:96px;height:64px;background:var(--surface-1);border:1px solid var(--accent);border-radius:6px;box-shadow:4px 4px 0 0 var(--block-shadow-color);transform:translate(-2px,-2px)"></div><span class="lab">hover · button</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:96px;height:64px;background:var(--surface-1);border:1px solid var(--accent);border-radius:6px;box-shadow:3px 3px 0 0 var(--accent-deep);transform:translate(-2px,-2px)"></div><span class="lab">focus · input</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:96px;height:64px;background:var(--surface-1);border:1px solid var(--accent);border-radius:6px;box-shadow:var(--shadow-overlay);"></div><span class="lab">overlay</span></div></div></body></html>
