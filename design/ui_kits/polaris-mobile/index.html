<script type="text/babel">
const KEY = 'polaris-mobile-route';
const SCREENS = [['login', 'Entrar', 'polaris'], ['inicio', 'Inicio', 'polaris'], ['odisea', 'Odisea', 'odisea'], ['kuiper', 'Kuiper', 'kuiper'], ['fusion', 'Fusión', 'fusion'], ['atlas', 'Atlas', 'atlas'], ['perfil', 'Perfil', 'nucleo']];
function useFit() {
  const [s, setS] = React.useState(1);
  React.useEffect(() => { const f = () => setS(Math.min(1, (window.innerHeight - 40) / 874, (window.innerWidth - 40) / 402)); f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  return s;
}
function App() {
  const { Toast } = DS();
  const [route, setRoute] = React.useState(() => localStorage.getItem(KEY) || 'login');
  const [toast, setToast] = React.useState(null);
  const go = r => { setRoute(r); localStorage.setItem(KEY, r); };
  const say = t => { setToast(t); clearTimeout(window.__mt); window.__mt = setTimeout(() => setToast(null), 3000); };
  const scale = useFit();
  const mod = (SCREENS.find(s => s[0] === route) || SCREENS[1])[2];
  const screens = { inicio: <MInicio go={go} />, odisea: <MOdisea go={go} toast={say} />, kuiper: <MKuiper go={go} />, fusion: <MFusion go={go} />, atlas: <MAtlas go={go} />, perfil: <MPerfil go={go} logout={() => go('login')} /> };
  return (
    <div className="stage">
      <div className="stage__phone" style={{ transform: 'scale(' + scale + ')', width: 402, height: 874, margin: (874 * (scale - 1)) / 2 + 'px ' + (402 * (scale - 1)) / 2 + 'px' }}>
        <IOSDevice dark>
          <div className="m-app" data-module={mod} data-screen-label={route}>
            {route === 'login' ? <MLogin onLogin={() => go('inicio')} /> : <>
              <div className="m-sky"><StarTrails pole={[0.5, -0.06]} speed={0.35} density={0.8} /></div>
              <div className="m-veil" /><div className="m-glow" />
              <React.Fragment key={route}>{screens[route] || screens.inicio}</React.Fragment>
              <MTabBar route={route} go={go} />
              {toast && <div className="m-toast"><Toast tone="success" onClose={() => setToast(null)}>{toast}</Toast></div>}
            </>}
          </div>
        </IOSDevice>
      </div>
      <aside className="stage__rail">
        <span className="pl-eyebrow">Polaris · UI kit móvil</span>
        <h2>Pantallas</h2>
        <div className="stage__list">{SCREENS.map(([id, l, m]) => <button key={id} data-module={m} className={route === id ? 'on' : ''} onClick={() => go(id)}><i />{l}</button>)}</div>
        <p>Barra de módulos flotante abajo; perfil desde el avatar. Mismos tokens, componentes y datos que la versión web.</p>
        <a href="../../index.html">Ver versión web →</a>
      </aside>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
