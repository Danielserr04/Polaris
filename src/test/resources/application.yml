# Configuracion solo de tests. Sustituye a la de src/main/resources.
#
# Existe para que la suite no dependa de credenciales reales: sin esto, un
# GOOGLE_CLIENT_ID vacio tumba el contexto entero con
# "Client id of registration 'google' must not be empty".
spring:
  application:
    name: polaris

  # El .env de la raiz no se carga en tests: los valores de abajo son fijos
  # y falsos a proposito.
  config:
    import: ""

  # dev activo: LogEnviarVerificacionAdapter es @Profile("dev") y sin esto un
  # test con contexto completo no encontraria bean para EnviarVerificacionPort.
  profiles:
    active: dev

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - email
              - profile

  jackson:
    default-property-inclusion: non_null

polaris:
  jwt:
    # 64 caracteres. No es ningun secreto real y no vale fuera de los tests.
    secreto: secreto-de-tests-que-no-vale-para-nada-fuera-de-aqui-0123456789
    expiracion-segundos: 3600
    emisor: polaris
  url-base: http://localhost:8080

  # Los tests de dominio mockean el puerto y no llaman a TMDB. Estos valores
  # existen solo para que el adaptador se pueda construir si algun test levanta
  # el contexto completo.
  tmdb:
    url-base: https://api.themoviedb.org/3
    token: ""
    imagen-base: https://image.tmdb.org/t/p/w500
    idioma: es-ES

  # Igual que tmdb: los tests de dominio mockean el puerto. Estos valores solo
  # existen para que el adaptador se pueda construir.
  igdb:
    url-api: https://api.igdb.com/v4
    url-token: https://id.twitch.tv/oauth2/token
    client-id: ""
    client-secret: ""
    imagen-base: https://images.igdb.com/igdb/image/upload/t_cover_big/

  openlibrary:
    url-base: https://openlibrary.org
    imagen-base: https://covers.openlibrary.org/b/id/
    user-agent: "Polaris/tests"
