spring:
  application:
    name: polaris

  # Carga el .env de la raiz como fichero de propiedades, si existe.
  # Asi `mvnw spring-boot:run` coge las credenciales sin exportar nada a mano
  # y sin que ninguna clave viva en el repo. Ver convenciones.md.
  config:
    import: optional:file:.env[.properties]

  profiles:
    default: dev

  datasource:
    url: ${POLARIS_DB_URL}
    username: ${POLARIS_DB_USER}
    password: ${POLARIS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # B2 cerrado: el esquema lo construye Flyway desde db/migration.
  # Ver docs/decisiones/007-esquema-ddl-auto-luego-flyway.md
  flyway:
    enabled: true
    # La base de dev ya existia, creada por ddl-auto durante B0-B2, y no tiene
    # tabla de historico. baseline-on-migrate la marca como si V1 ya estuviera
    # aplicada en vez de reventar por encontrar tablas sin registrar.
    # En una base vacia no cambia nada: V1 se aplica igual.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # El esquema es de Flyway. Hibernate solo comprueba que las entidades
      # cuadran con lo que hay y aborta el arranque si no.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # Las tablas nacen en utf8mb4 por el charset del servidor, que fija
        # docker-compose.yml con --character-set-server=utf8mb4.
        #
        # OJO: aqui habia un hbm2ddl.charset_name: utf8mb4 que no hacia eso.
        # Hibernate usa esa propiedad como charset de JAVA para hashear nombres
        # de constraints, y utf8mb4 no es un charset de Java: reventaba el
        # arranque en cuanto una entidad declaraba un unique.
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid, email y profile son scopes NO sensibles: no pasan por
            # el proceso de verificacion de Google. Ver docs/modulos/auth.md
            scope:
              - openid
              - email
              - profile

server:
  port: ${POLARIS_PORT:8080}

polaris:
  jwt:
    # Secreto HMAC del JWT propio. Minimo 32 bytes para HS256.
    secreto: ${POLARIS_JWT_SECRETO}
    # Vida del token en segundos. 12 horas.
    expiracion-segundos: ${POLARIS_JWT_EXPIRACION:43200}
    emisor: polaris
  # Para construir el enlace de verificacion de email. Sin barra final.
  url-base: ${POLARIS_URL_BASE:http://localhost:8080}
  correo:
    # Solo lo usa SmtpEnviarVerificacionAdapter, que es @Profile("prod").
    # En dev el enlace va al log y esto ni se lee.
    remitente: ${POLARIS_CORREO_REMITENTE:no-reply@polaris.local}

  # Catalogo externo de peliculas y series (B3).
  tmdb:
    url-base: https://api.themoviedb.org/3
    # "API Read Access Token" (v4), que va en la cabecera Authorization.
    # Vacio a proposito: la aplicacion arranca sin el y la busqueda responde
    # 400 diciendo que falta, en vez de tumbar el contexto entero.
    token: ${POLARIS_TMDB_TOKEN:}
    # poster_path llega relativo. w500 es el ancho util para una caratula.
    imagen-base: https://image.tmdb.org/t/p/w500
    idioma: es-ES

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.polaris: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

  # SMTP real. Solo en prod: en dev no hay bean de correo que configurar.
  # Con Gmail hace falta una "contrasena de aplicacion", no la del Google;
  # el acceso con la contrasena normal esta desactivado desde 2022.
  mail:
    host: ${POLARIS_SMTP_HOST}
    port: ${POLARIS_SMTP_PUERTO:587}
    username: ${POLARIS_SMTP_USUARIO}
    password: ${POLARIS_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    com.polaris: INFO
