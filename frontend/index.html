<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12110e" />
    <title>Polaris</title>
    <link rel="icon" href="/assets/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/app-icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Polaris" />
    <style>html{background:#12110e}html[data-theme="light"]{background:#f2eee6}</style>
    <script>
      // Tema antes del primer pintado, sin esperar a React (asi no hay destello oscuro al abrir en claro).
      // Misma regla que src/lib/tema.ts; el login y el callback siempre van en oscuro.
      (function () {
        try {
          if (/^\/(login|auth\/)/.test(location.pathname)) return;
          var t = localStorage.getItem('polaris.tema');
          if (t === 'claro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
